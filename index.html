<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Malíř Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#F5F2ED;--surface:#FFFFFF;--surface2:#F0EDE8;--text:#1A1814;--text2:#6B6660;
    --text3:#9E9994;--accent:#C85A1E;--accent-light:#FAF0EA;--green:#2D6A2D;
    --green-light:#EAF3E4;--red:#A32D2D;--red-light:#FCEBEB;--border:#E2DDD8;
    --radius:12px;--radius-sm:8px;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 14px;position:sticky;top:0;z-index:100;}
  .header-top{display:flex;align-items:center;gap:10px;}
  .header-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  h1{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
  .subtitle{font-size:12px;color:var(--text3);margin-top:2px;}
  .container{padding:16px 16px 0;}
  .section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px;}
  .section-label:first-child{margin-top:0;}
  .job-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .job-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text);text-align:left;cursor:pointer;line-height:1.35;}
  .job-btn:active{background:var(--surface2);}
  .job-btn.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
  .worker-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .worker-row{display:flex;align-items:center;gap:12px;}
  .worker-label{font-size:14px;color:var(--text2);white-space:nowrap;}
  input[type=range]{flex:1;height:4px;border-radius:2px;-webkit-appearance:none;appearance:none;background:var(--border);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);cursor:pointer;}
  .worker-num{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;min-width:28px;text-align:center;color:var(--accent);}
  .voice-btn{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:var(--text);cursor:pointer;}
  .voice-btn.listening{background:var(--accent-light);border-color:var(--accent);color:var(--accent);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
  .vstatus{font-size:12px;color:var(--text3);text-align:center;padding:6px 0 2px;min-height:22px;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;}
  .stat-n{font-size:24px;font-weight:600;line-height:1;}
  .stat-l{font-size:11px;color:var(--text3);margin-top:3px;}
  .stat-card.have .stat-n{color:var(--green);}
  .stat-card.missing .stat-n{color:var(--red);}
  .checklist-section{margin-top:4px;}
  .sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;}
  .item-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:5px;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .item-row:active{background:var(--surface2);}
  .item-row.checked{background:var(--green-light);border-color:#97C459;}
  .item-row.extra{border-style:dashed;border-color:#B5D4F4;background:#F5F9FE;}
  .item-row.extra.checked{background:var(--green-light);border-color:#97C459;border-style:solid;}
  .chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:transparent;}
  .item-row.checked .chk{background:var(--green);border-color:var(--green);color:#fff;}
  .iname{font-size:14px;flex:1;line-height:1.3;}
  .item-row.checked .iname{color:var(--green);text-decoration:line-through;text-decoration-color:#97C459;}
  .qty{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);background:var(--surface2);padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .item-row.checked .qty{background:#C0DD97;color:var(--green);}
  .toggle-row{display:flex;align-items:center;gap:12px;background:#E6F1FB;border:1px solid #B5D4F4;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:5px;cursor:pointer;}
  .toggle-row.on{background:var(--green-light);border-color:#97C459;}
  .toggle-box{width:22px;height:22px;border-radius:4px;border:1.5px solid #378ADD;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:transparent;background:white;}
  .toggle-row.on .toggle-box{background:var(--green);border-color:var(--green);color:#fff;}
  .toggle-label{font-size:14px;font-weight:500;color:#0C447C;flex:1;}
  .toggle-row.on .toggle-label{color:var(--green);}
  .status-block{margin:12px 0 4px;}
  .missing-box{background:var(--red-light);border:1px solid #F09595;border-radius:var(--radius);padding:14px 16px;}
  .missing-title{font-size:13px;font-weight:600;color:var(--red);margin-bottom:8px;}
  .missing-item{font-size:13px;color:var(--red);padding:3px 0;}
  .ready-box{background:var(--green-light);border:1px solid #97C459;border-radius:var(--radius);padding:14px 16px;text-align:center;color:var(--green);font-size:15px;font-weight:600;}
  .reset-btn{width:100%;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text3);cursor:pointer;margin-top:16px;}
  #mainContent{display:none;}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="header-icon">🎨</div>
    <div>
      <h1>Malíř Checklist</h1>
      <div class="subtitle">Vybavení pro každou zakázku</div>
    </div>
  </div>
</header>
<div class="container">
  <div class="section-label">Typ zakázky</div>
  <div class="job-grid" id="jobGrid"></div>
  <div id="mainContent">
    <div class="section-label">Počet pracovníků</div>
    <div class="worker-card">
      <div class="worker-row">
        <span class="worker-label">Pracovníci</span>
        <input type="range" min="1" max="8" step="1" value="1" id="workerSlider">
        <span class="worker-num" id="workerVal">1</span>
      </div>
    </div>
    <div class="section-label">Hlasové ovládání</div>
    <button class="voice-btn" id="voiceBtn">
      <span>🎙️</span>
      <span id="voiceBtnText">Řekni co máš</span>
    </button>
    <div class="vstatus" id="vstatus"></div>
    <div class="section-label">Přehled</div>
    <div class="stats-row">
      <div class="stat-card have"><div class="stat-n" id="sHave">0</div><div class="stat-l">mám</div></div>
      <div class="stat-card missing"><div class="stat-n" id="sMissing">0</div><div class="stat-l">chybí</div></div>
      <div class="stat-card"><div class="stat-n" id="sTotal">0</div><div class="stat-l">celkem</div></div>
    </div>
    <div class="checklist-section" id="checklistArea"></div>
    <div class="status-block" id="statusBlock"></div>
    <button class="reset-btn" id="resetBtn">↺ Resetovat checklist</button>
  </div>
</div>

  }
};

let cj=null,workers=1,checked={},recognition=null,listening=false,latexOn=false;

function init(){
  const g=document.getElementById('jobGrid');
  Object.keys(JOBS).forEach(name=>{
    const b=document.createElement('button');
    b.className='job-btn'; b.textContent=name;
    b.onclick=()=>selectJob(name); g.appendChild(b);
  });
  document.getElementById('workerSlider').oninput=function(){
    workers=parseInt(this.value);
    document.getElementById('workerVal').textContent=workers;
    render();
  };
  document.getElementById('voiceBtn').onclick=toggleVoice;
  document.getElementById('resetBtn').onclick=()=>{checked={};latexOn=false;render();};
}

function selectJob(name){
  cj=name; checked={}; latexOn=false;
  document.querySelectorAll('.job-btn').forEach(b=>b.classList.remove('active'));
  [...document.querySelectorAll('.job-btn')].find(b=>b.textContent===name)?.classList.add('active');
  document.getElementById('mainContent').style.display='block';
  render();
}

function getStetecQty(){return workers<=1?2:(workers+1);}

function getQty(q){
  if(q===1||q==='') return '';
  if(q==='W') return '×'+workers;
  if(q==='S') return '×'+getStetecQty();
  if(q==='M2') return '×'+Math.min(workers,2);
  if(q==='Wx2') return '×'+(workers*2);
  return q;
}

function render(){
  if(!cj) return;
  const area=document.getElementById('checklistArea');
  area.innerHTML='';
  const job=JOBS[cj];
  const hasLatex=job.latex===true;
  Object.entries(job).forEach(([sec,items])=>{
    if(sec==='latex') return;
    const t=document.createElement('div');
    t.className='sec-title'; t.textContent=sec; area.appendChild(t);
    if(sec==='Nářadí'&&hasLatex){
      const tog=document.createElement('div');
      tog.className='toggle-row'+(latexOn?' on':'');
      tog.innerHTML=`<div class="toggle-box">${latexOn?'✓':''}</div><span class="toggle-label">+ Omyvatelná / latex</span>`;
      tog.onclick=()=>{latexOn=!latexOn;render();};
      area.appendChild(tog);
    }
    items.forEach(item=>{
      const row=document.createElement('div');
      row.className='item-row'+(checked[item.n]?' checked':'');
      const ql=getQty(item.q);
      row.innerHTML=`<div class="chk">${checked[item.n]?'✓':''}</div><span class="iname">${item.n}</span>${ql?`<span class="qty">${ql}</span>`:''}`;
      row.onclick=()=>{checked[item.n]=!checked[item.n];render();};
      area.appendChild(row);
    });
    if(sec==='Nářadí'&&hasLatex&&latexOn){
      LATEX_EXTRA.forEach(item=>{
        const row=document.createElement('div');
        row.className='item-row extra'+(checked[item.n]?' checked':'');
        const ql=getQty(item.q);
        row.innerHTML=`<div class="chk">${checked[item.n]?'✓':''}</div><span class="iname">${item.n}</span>${ql?`<span class="qty">${ql}</span>`:''}`;
        row.onclick=()=>{checked[item.n]=!checked[item.n];render();};
        area.appendChild(row);
      });
    }
  });
  updateStats();
}

function allItems(){
  if(!cj) return [];
  const job=JOBS[cj];
  let all=[];
  Object.entries(job).forEach(([sec,items])=>{
    if(sec==='latex') return;
    if(sec.startsWith('Podle potřeby')) return;
    all=all.concat(items.map(i=>i.n));
  });
  return all;
}

function updateStats(){
  const all=allItems();
  const total=all.length,have=all.filter(n=>checked[n]).length,missing=total-have;
  document.getElementById('sHave').textContent=have;
  document.getElementById('sMissing').textContent=missing;
  document.getElementById('sTotal').textContent=total;
  const block=document.getElementById('statusBlock');
  if(missing===0){
    block.innerHTML='<div class="ready-box">✅ Jste plně vybaveni!</div>';
  } else {
    const mis=all.filter(n=>!checked[n]);
    block.innerHTML=`<div class="missing-box"><div class="missing-title">⚠️ Chybí ${missing} položek:</div>${mis.map(n=>`<div class="missing-item">• ${n}</div>`).join('')}</div>`;
  }
}

function toggleVoice(){
  if(listening){stopVoice();return;}
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    document.getElementById('vstatus').textContent='Hlas není podporován — zkus Chrome.';
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang='cs-CZ'; recognition.continuous=false; recognition.interimResults=false;
  listening=true;
  document.getElementById('voiceBtn').classList.add('listening');
  document.getElementById('voiceBtnText').textContent='Poslouchám... (klepni pro zastavení)';
  document.getElementById('vstatus').textContent='Řekni co máš, např. "mám válečky, pásky a štafle"';
  recognition.onresult=e=>{
    const t=e.results[0][0].transcript.toLowerCase();
    document.getElementById('vstatus').textContent='Slyšel jsem: "'+t+'"';
    matchVoice(t); stopVoice();
  };
  recognition.onerror=()=>{document.getElementById('vstatus').textContent='Nepodařilo se — zkus znovu.';stopVoice();};
  recognition.onend=()=>stopVoice();
  recognition.start();
}

function stopVoice(){
  listening=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  document.getElementById('voiceBtn').classList.remove('listening');
  document.getElementById('voiceBtnText').textContent='Řekni co máš';
}

function matchVoice(t){
  if(!cj) return;
  const all=allItems();
  let matched=0;
  all.forEach(name=>{
    const kws=name.toLowerCase().replace(/[()\/+!]/g,' ').split(/[\s,]+/).filter(w=>w.length>3);
    if(kws.some(kw=>t.includes(kw))){checked[name]=true;matched++;}
  });
  document.getElementById('vstatus').textContent=matched>0?'Zaškrtnuto '+matched+' položek!':'Nic nenalezeno — zkus klepnout ručně.';
  render();
}

init();
</script>
</body>
</html>
